# fly.toml — Fly.io deployment config for Archi-Flow
# Deploy: fly deploy
# First time: fly launch --no-deploy (then fly deploy)

app = "archi-flow"
primary_region = "sjc"   # San Jose — change to nearest: lhr=London, sin=Singapore, syd=Sydney

[build]
  dockerfile = "Dockerfile"

[env]
  PORT     = "8080"
  NODE_ENV = "production"
  # Secrets (never put real values here — use: fly secrets set KEY=value)
  # SUPABASE_URL             = ""
  # SUPABASE_ANON_KEY        = ""
  # SUPABASE_SERVICE_ROLE_KEY = ""
  # SIGNALING_URL            = ""

[http_service]
  internal_port        = 8080
  force_https          = true
  auto_stop_machines   = true   # free tier: stop when idle
  auto_start_machines  = true   # wake on first request
  min_machines_running = 0      # 0 = fully free when idle

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  memory = "256mb"
  cpus   = 1
